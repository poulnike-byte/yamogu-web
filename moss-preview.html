<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ЯмогУ! — анимация мха</title><style>
*{box-sizing:border-box}body{margin:0;background:#b9e4ed;display:grid;place-items:center;min-height:100svh;font-family:system-ui}main{height:100svh;max-width:100vw;aspect-ratio:853/1844;position:relative}svg{display:block;width:100%;height:100%}button{position:absolute;border:0;background:#fffdf1e8;color:#54462c;border-radius:24px;padding:10px 16px;font:600 13px system-ui;bottom:max(8px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);white-space:nowrap}.flower{transform-box:view-box;transform-origin:62px 1435px;animation:breeze 4.8s ease-in-out infinite alternate}.flower.b{transform-origin:793px 1466px;animation-duration:5.9s;animation-delay:-2s}@keyframes breeze{from{transform:rotate(-1.3deg)}to{transform:rotate(1.3deg)}}@media(prefers-reduced-motion:reduce){.flower{animation:none}}
</style><main><svg viewBox="0 0 853 1844" role="img" aria-label="ЯмогУ! Буквы Начать постепенно зарастают мхом, ромашки покачиваются">
<defs><clipPath id="letters"><rect x="130" y="1385" width="605" height="121" rx="12"/></clipPath><mask id="grow"><rect width="853" height="1844" fill="black"/><g id="seeds" fill="white"/></mask><clipPath id="fl"><ellipse cx="62" cy="1392" rx="58" ry="43"/></clipPath><clipPath id="fr"><ellipse cx="793" cy="1407" rx="55" ry="59"/></clipPath></defs>
<image href="img/moss-preview.webp" width="853" height="1844"/>
<image href="img/dry-preview.webp" width="853" height="1844" clip-path="url(#letters)"/>
<g clip-path="url(#letters)"><image href="img/moss-preview.webp" width="853" height="1844" mask="url(#grow)"/></g>
<g class="flower"><image href="img/moss-preview.webp" width="853" height="1844" clip-path="url(#fl)"/></g>
<g class="flower b"><image href="img/moss-preview.webp" width="853" height="1844" clip-path="url(#fr)"/></g>
</svg><button id="replay">Повторить анимацию</button></main><script>
const group=document.getElementById('seeds'),reduced=matchMedia('(prefers-reduced-motion: reduce)'),seeds=[];
let rng=47;function rand(){rng=(rng*1664525+1013904223)>>>0;return rng/4294967296}
for(let y=1380;y<1525;y+=18)for(let x=120;x<750;x+=18){let el=document.createElementNS('http://www.w3.org/2000/svg','circle');el.setAttribute('cx',x+rand()*12);el.setAttribute('cy',y+rand()*12);group.append(el);seeds.push({el,delay:rand()*1500,max:19+rand()*8})}
let frame,start,done=false;function tick(t){if(document.hidden)return;start??=t;const elapsed=t-start;for(const s of seeds){const p=Math.max(0,Math.min(1,(elapsed-s.delay)/1000));s.el.setAttribute('r',s.max*p*p*(3-2*p))}if(elapsed<2700)frame=requestAnimationFrame(tick);else{done=true;document.documentElement.dataset.growth='complete'}}
function play(){cancelAnimationFrame(frame);start=null;done=false;document.documentElement.dataset.growth='running';for(const s of seeds)s.el.setAttribute('r',reduced.matches?s.max:0);if(reduced.matches){done=true;document.documentElement.dataset.growth='complete'}else frame=requestAnimationFrame(tick)}
document.getElementById('replay').onclick=play;
document.addEventListener('visibilitychange',()=>{document.querySelectorAll('.flower').forEach(e=>e.style.animationPlayState=document.hidden?'paused':'running');if(document.hidden)cancelAnimationFrame(frame);else if(!done)play()});
Promise.all(['img/moss-preview.webp','img/dry-preview.webp'].map(src=>{const i=new Image();i.src=src;return i.decode()})).then(()=>setTimeout(play,400)).catch(()=>{document.getElementById('replay').textContent='Не загрузилась графика — повторить';});window.previewReady=true;
</script></html>
