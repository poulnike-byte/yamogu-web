if(new URLSearchParams(location.search).has('app')){document.getElementById('replay').hidden=true;document.getElementById('wind').hidden=true;}
const group=document.getElementById('seeds'),reduced=matchMedia('(prefers-reduced-motion: reduce)'),seeds=[];
let rng=47;function rand(){rng=(rng*1664525+1013904223)>>>0;return rng/4294967296}
for(let y=1380;y<1525;y+=30)for(let x=120;x<750;x+=30){let el=document.createElementNS('http://www.w3.org/2000/svg','circle');el.setAttribute('cx',x+rand()*12);el.setAttribute('cy',y+rand()*12);group.append(el);seeds.push({el,delay:rand()*3500,max:30+rand()*10})}
let frame,start,lastPaint=0,done=false;function tick(t){if(t-lastPaint<32){frame=requestAnimationFrame(tick);return}lastPaint=t;if(document.hidden)return;start??=t;const elapsed=t-start;for(const s of seeds){const p=Math.max(0,Math.min(1,(elapsed-s.delay)/2500));s.el.setAttribute('r',s.max*p*p*(3-2*p))}if(elapsed<6200)frame=requestAnimationFrame(tick);else{done=true;document.documentElement.dataset.growth='complete'}}
function play(){cancelAnimationFrame(frame);start=null;done=false;document.documentElement.dataset.growth='running';for(const s of seeds)s.el.setAttribute('r',reduced.matches?s.max:0);if(reduced.matches){done=true;document.documentElement.dataset.growth='complete'}else frame=requestAnimationFrame(tick)}

let wind=true;document.getElementById('wind').onclick=()=>{wind=!wind;document.getElementById('wind').textContent=wind?'Ветер: вкл':'Ветер: выкл';syncBreeze()};function syncBreeze(){const svg=document.querySelector('svg');if(document.hidden||reduced.matches||!wind)svg.pauseAnimations();else svg.unpauseAnimations()}reduced.addEventListener('change',()=>{syncBreeze();if(reduced.matches)play()});syncBreeze();
